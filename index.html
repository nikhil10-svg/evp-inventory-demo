<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVP Customer Inventory (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef1f4; --surface: #ffffff; --ink: #1c2430; --muted: #5b6676;
    --line: #d5dbe3; --accent: #ff7900; --ok: #1f8a5b; --warn: #b26b00; --bad: #c0392b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151a21; --surface: #1e252e; --ink: #e6ebf1; --muted: #9aa6b5;
      --line: #313b47; --accent: #ff8c26; --ok: #46c08a; --warn: #e3a33b; --bad: #ef6a5b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 15px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px;
           border-left: 6px solid var(--accent); padding-left: 14px; margin-bottom: 28px; }
  h1 { font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; font-size: 30px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px;
            background: var(--line); border: 1px solid var(--line); margin-bottom: 24px; }
  .totals div { background: var(--surface); padding: 14px 16px; }
  .totals b { display: block; font-size: 26px; font-weight: 600; }
  .totals span { color: var(--muted); font-size: 13px; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  input, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
                  padding: 8px 10px; border-radius: 4px; }
  input { flex: 1 1 240px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; border: 1px solid currentColor; }
  .Active { color: var(--ok); } .Pending { color: var(--warn); } .Inactive { color: var(--bad); }
  .meter { width: 110px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .pct { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .detail td { background: var(--paper); }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; padding: 6px 0; }
  .detail h3 { font-size: 14px; margin: 0 0 6px; }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; }
  .missing { color: var(--bad); font-style: italic; }
  ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .err { padding: 16px; border: 1px solid var(--bad); color: var(--bad); background: var(--surface); }
  @media (prefers-reduced-motion: no-preference) { .meter i { transition: width .4s ease; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>EVP customer inventory</h1>
    <span class="sub" id="stamp">Loading data…</span>
  </header>

  <section class="totals" id="totals" aria-label="Totals"></section>

  <div class="filters">
    <input id="q" type="search" placeholder="Search customer, ICO1, PoP, product" aria-label="Search">
    <select id="status" aria-label="Filter by status">
      <option value="">All statuses</option><option>Active</option><option>Pending</option><option>Inactive</option>
    </select>
    <select id="region" aria-label="Filter by region"><option value="">All regions</option></select>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Customer</th><th>ICO1</th><th>Product</th><th>Region</th><th>VMs</th>
        <th>Service owner</th><th>DSRF</th><th>Status</th><th>Data complete</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script>
// Fields treated as mandatory for the "Data complete" meter (path inside each JSON file)
const MANDATORY = [
  "general.customer_name", "general.ico1_id", "general.initial_deployed_region",
  "infrastructure.product", "infrastructure.number_of_vms",
  "contacts.csm", "contacts.customer_service_desk", "contacts.service_owner",
  "contacts.configuration_team", "contacts.customer_technical_contact"
];
const get = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
const filled = v => v !== null && v !== undefined && v !== "";
const show = v => filled(v) ? escapeHtml(String(v)) : '<span class="missing">missing</span>';
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

// Fetch one JSON file and say exactly which file failed and why
async function getJson(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(`${path} was not found (HTTP ${r.status}). Check the file exists at that exact path in the repo`);
  const text = await r.text();
  try { return JSON.parse(text); }
  catch { throw new Error(`${path} is not valid JSON. Open it in the repo and check for a missing comma, quote or bracket`); }
}

let customers = [];
let openId = null;

async function load() {
  try {
    // cache: "no-store" so a fresh commit shows up on reload
    const manifest = await getJson("data/manifest.json");
    customers = await Promise.all(manifest.customers.map(getJson));
    customers.forEach(c => c._complete = Math.round(100 * MANDATORY.filter(f => filled(get(c, f))).length / MANDATORY.length));
    const regions = [...new Set(customers.map(c => c.general.initial_deployed_region))].sort();
    document.getElementById("region").insertAdjacentHTML("beforeend", regions.map(r => `<option>${escapeHtml(r)}</option>`).join(""));
    const newest = customers.map(c => c.last_updated).sort().pop();
    document.getElementById("stamp").textContent = `${customers.length} customers, latest update ${newest}`;
    render();
  } catch (e) {
    document.querySelector(".table-wrap").outerHTML =
      `<div class="err">Couldn't load the data: ${escapeHtml(e.message)}. If you opened this file directly from your computer, use GitHub Pages or a local server instead (see README).</div>`;
    document.getElementById("stamp").textContent = "Data not loaded";
  }
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const st = document.getElementById("status").value;
  const rg = document.getElementById("region").value;
  const list = customers.filter(c =>
    (!st || c.status === st) && (!rg || c.general.initial_deployed_region === rg) &&
    (!q || JSON.stringify(c).toLowerCase().includes(q)));

  const vms = list.reduce((s, c) => s + (c.infrastructure.number_of_vms || 0), 0);
  const pops = new Set(list.flatMap(c => c.pops.map(p => p.name))).size;
  const open = list.reduce((s, c) => s + c.open_points.length, 0);
  document.getElementById("totals").innerHTML = [
    [list.length, "customers shown"], [vms, "virtual machines"], [pops, "distinct PoPs"], [open, "open points"]
  ].map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join("");

  document.getElementById("rows").innerHTML = list.map(c => {
    const id = c.general.ico1_id;
    const row = `<tr class="row" tabindex="0" data-id="${escapeHtml(id)}" aria-expanded="${openId === id}">
      <td><strong>${escapeHtml(c.general.customer_name)}</strong></td>
      <td>${show(id)}</td>
      <td>${show(c.infrastructure.product)} ${filled(c.infrastructure.sub_product) ? "/ " + escapeHtml(c.infrastructure.sub_product) : ""}</td>
      <td>${show(c.general.initial_deployed_region)}</td>
      <td>${show(c.infrastructure.number_of_vms)}</td>
      <td>${show(c.contacts.service_owner)}</td>
      <td>${show(c.dsrf.dsrf_id)}<br><span class="sub">${escapeHtml(c.dsrf.status)}</span></td>
      <td><span class="pill ${escapeHtml(c.status)}">${escapeHtml(c.status)}</span></td>
      <td><span class="meter"><i style="width:${c._complete}%"></i></span><span class="pct">${c._complete}%</span></td>
    </tr>`;
    return row + (openId === id ? detail(c) : "");
  }).join("") || `<tr><td colspan="9">No customers match these filters. Clear the search or pick another status.</td></tr>`;
}

function detail(c) {
  const pops = c.pops.map(p => `<li>${escapeHtml(p.name)} (${escapeHtml(p.role)}): Internet ${show(p.internet_bw_mbps)} Mbps, MPLS ${show(p.mpls_bw_mbps)} Mbps, ${show(p.vcpus)} vCPUs</li>`).join("");
  const ct = c.contacts;
  return `<tr class="detail"><td colspan="9"><div class="detail-grid">
    <div><h3>Contacts and ownership</h3><dl>
      <dt>CSM</dt><dd>${show(ct.csm)}</dd>
      <dt>Service desk</dt><dd>${show(ct.customer_service_desk)}</dd>
      <dt>Integrator</dt><dd>${show(ct.integrator)}</dd>
      <dt>Config team</dt><dd>${show(ct.configuration_team)}</dd>
      <dt>Technical contact</dt><dd>${show(ct.customer_technical_contact)}</dd>
    </dl></div>
    <div><h3>PoPs</h3><ul>${pops}</ul>
      <h3 style="margin-top:12px">Infrastructure</h3><dl>
      <dt>Blueprint</dt><dd>${show(c.infrastructure.blueprint)}</dd>
      <dt>Console deployed</dt><dd>${c.infrastructure.console_deployed ? "Yes" : "No"}</dd>
      <dt>Install offer</dt><dd>${show(c.general.install_offer_id)}</dd></dl></div>
    <div><h3>Open points</h3>${c.open_points.length ? `<ul>${c.open_points.map(o => `<li>${escapeHtml(o)}</li>`).join("")}</ul>` : '<span class="sub">None</span>'}
      <h3 style="margin-top:12px">Record</h3><dl>
      <dt>Last updated</dt><dd>${escapeHtml(c.last_updated)}</dd>
      <dt>DSRF submitted</dt><dd>${show(c.dsrf.submitted_on)}</dd></dl></div>
  </div></td></tr>`;
}

function toggle(id) { openId = openId === id ? null : id; render(); }
document.getElementById("rows").addEventListener("click", e => { const r = e.target.closest("tr.row"); if (r) toggle(r.dataset.id); });
document.getElementById("rows").addEventListener("keydown", e => {
  const r = e.target.closest("tr.row");
  if (r && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(r.dataset.id); }
});
["q", "status", "region"].forEach(id => document.getElementById(id).addEventListener("input", render));
load();
</script>
</body>
</html>
